name: Update Lines of Code in Readme

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  count-lines:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HIGHLIGHT_LANGS: "JavaScript,TypeScript,Python,C++,C#,CMake,Swift,Java,Dart,Rust,Ruby,Kotlin"
      IGNORE_LANGS: "JSON,HTML,CSS,SCSS,Sass,Markdown,SVG,XML,YAML,TOML,CSV,Text,Properties"

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Install cloc
        run: |
          sudo apt-get update
          sudo apt-get install -y cloc
          cloc --version

      - name: Fetch and clone repositories
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          scan_dir=$(mktemp -d "$RUNNER_TEMP/cloc.XXXXXX")
          cd "$scan_dir"
          mkdir repos

          gh api --paginate 'user/repos?per_page=100' \
            --jq '.[] | select(.fork == false) | .full_name' > repositories.txt

          if [[ ! -s repositories.txt ]]; then
            echo "::error::The GitHub API returned no non-fork repositories."
            exit 1
          fi

          git_auth() {
            git -c credential.helper= \
              -c 'credential.helper=!gh auth git-credential' "$@"
          }

          while IFS= read -r repo; do
            url="https://github.com/$repo.git"
            destination="repos/$repo"
            mkdir -p "repos/${repo%/*}"
            echo "Cloning $repo"

            git_auth clone --quiet --depth=1 --no-tags -- "$url" "$destination"

            if git -C "$destination" rev-parse --verify --quiet HEAD >/dev/null; then
              continue
            fi

            if git_auth ls-remote --exit-code --heads "$url" >/dev/null; then
              echo "::error::$repo has branches but no usable default branch."
              exit 1
            elif [[ $? -eq 2 ]]; then
              echo "Skipping empty repository $repo."
            else
              echo "::error::Could not verify whether $repo is empty."
              exit 1
            fi
          done < repositories.txt

          echo "LOC_SCAN_DIR=$scan_dir/repos" >> "$GITHUB_ENV"

      - name: Count lines of code
        shell: bash
        run: |
          mkdir -p output
          time cloc "$LOC_SCAN_DIR" --json \
            --report-file=output/cloc-output.json \
            --exclude-lang="$IGNORE_LANGS" \
            --exclude-dir=node_modules,.git \
            --timeout=5

      - name: Update README and push
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("output/cloc-output.json").read_text(encoding="utf-8"))
          summary = report.get("SUM", {})
          if summary.get("nFiles", 0) < 1 or "code" not in summary:
              raise SystemExit("::error::cloc did not produce a usable report.")

          highlighted = {name.strip() for name in os.environ["HIGHLIGHT_LANGS"].split(",")}
          lines = ["```", "[ LANGUAGES BREAKDOWN ]", ""]
          others = 0
          for language, counts in report.items():
              if language in {"header", "SUM"}:
                  continue
              code = counts["code"]
              if code <= 0:
                  continue
              if language in highlighted:
                  lines.append(f"{language:<12} --> {code:,} lines")
              else:
                  others += code

          if others:
              lines.append(f"{'Others':<12} --> {others:,} lines")
          lines.extend(["", f"[ TOTAL LINES OF CODE: {summary['code']:,} ]", "```"])

          readme = Path("README.md")
          original = readme.read_text(encoding="utf-8")
          start = "<!-- LANGUAGES BREAKDOWN START -->"
          end = "<!-- LANGUAGES BREAKDOWN END -->"
          before, _, rest = original.partition(start)
          _, end_marker, after = rest.partition(end)
          if original.count(start) != 1 or original.count(end) != 1 or not end_marker:
              raise SystemExit("::error::README language breakdown markers are missing or invalid.")

          code_block = "\n".join(lines)
          readme.write_text(f"{before}{start}\n{code_block}\n{end}{after}", encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md output/cloc-output.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update README and cloc-output.json with latest code stats"
          git push origin HEAD
